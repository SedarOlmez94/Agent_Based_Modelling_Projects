name: Mesolithic Orkney ABM CI

# Scoped to the Rust ABM project so changes to other projects in this
# multi-project repository don't trigger this pipeline.
on:
  push:
    branches: [master, main]
    paths:
      - "Archaeology project/rust-revamp/mesolithic-orkey-abm/**"
      - ".github/workflows/mesolithic-orkney-abm.yml"
  pull_request:
    paths:
      - "Archaeology project/rust-revamp/mesolithic-orkey-abm/**"
      - ".github/workflows/mesolithic-orkney-abm.yml"
  workflow_dispatch:

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Path to the Rust crate within this multi-project repository.
  PROJECT_DIR: Archaeology project/rust-revamp/mesolithic-orkey-abm

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # eframe/egui builds against native windowing and GL libraries even for a
      # headless `cargo build`/`cargo test`, so they must be present on the runner.
      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.PROJECT_DIR }}/target
          key: ${{ runner.os }}-cargo-${{ hashFiles(format('{0}/Cargo.lock', env.PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo fmt --all -- --check

      - name: Clippy (lint)
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo build --verbose

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --verbose
